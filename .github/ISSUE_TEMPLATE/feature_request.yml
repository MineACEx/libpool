name: 💡 功能建议 / Feature request
description: 提出一个新功能或改进建议 · Suggest an idea
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你的建议！请说明这个功能解决什么问题。
        Thanks for the idea! Tell us what problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么痛点
      placeholder: e.g. 每次都要手动切换镜像，很麻烦…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望怎么实现
      placeholder: e.g. 在设置页记住上次选择的镜像，下次自动使用
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 其它可行方案（可选）
  - type: textarea
    id: notes
    attributes:
      label: 其它说明 / Additional context
      description: 截图、参考链接等
